<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minisheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234560dc'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h16M14 8v16' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("minisheet.theme");if(t==="light"||t==="dark")document.documentElement.dataset.mode=t;}catch(e){}</script>
<style>
/* Layout: full-height app. Top bar, tool row, formula row, scrolling grid, status bar. */
:root {
  --bg: #f1f4fa;
  --panel: #ffffff;
  --ink: #1f2638;
  --muted: #6a7389;
  --line: #e0e5ef;
  --head: #eaeff9;
  --accent: #4560dc;
  --sel: #e5ebfd;
  --err: #c7423a;
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141c; --panel: #171b26; --ink: #e4e8f2; --muted: #8b94ab;
    --line: #272d3d; --head: #1e2433; --accent: #8ba3ff; --sel: #222c4d; --err: #ff8f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141c; --panel: #171b26; --ink: #e4e8f2; --muted: #8b94ab;
  --line: #272d3d; --head: #1e2433; --accent: #8ba3ff; --sel: #222c4d; --err: #ff8f86;
  color-scheme: dark;
}
/* Manual choice from the footer button wins over the device setting. */
:root[data-mode="light"] {
  --bg: #f1f4fa; --panel: #ffffff; --ink: #1f2638; --muted: #6a7389;
  --line: #e0e5ef; --head: #eaeff9; --accent: #4560dc; --sel: #e5ebfd; --err: #c7423a;
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #11141c; --panel: #171b26; --ink: #e4e8f2; --muted: #8b94ab;
  --line: #272d3d; --head: #1e2433; --accent: #8ba3ff; --sel: #222c4d; --err: #ff8f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.3 var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }
button, select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; cursor: pointer;
}
button:hover:not(:disabled), select:hover { border-color: var(--accent); background: var(--sel); }
button:disabled { opacity: .4; cursor: default; }
button[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); color: var(--accent); font-weight: 700; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex-wrap: wrap; }
#top { padding-top: 8px; }
#name {
  flex: 1 1 0; min-width: 80px; max-width: 340px; background: transparent; border: 1px solid transparent;
  border-radius: 6px; padding: 5px 8px; font-size: 16px; font-weight: 600;
}
#name:hover, #name:focus { border-color: var(--line); background: var(--panel); }
.sp { flex: 1; }
#fxrow { padding-top: 0; flex-wrap: nowrap; }
#addr {
  flex: none; width: 52px; text-align: center; font-family: var(--mono); font-size: 13px;
  color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 5px 0; background: var(--panel);
}
#fx {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
#fx:focus { border-color: var(--accent); outline: none; }
#act { width: 78px; }

#wrap {
  flex: 1; min-height: 0; overflow: auto; background: var(--panel);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  position: relative; -webkit-overflow-scrolling: touch;
}
#wrap:focus { outline: none; }
#sheet { position: relative; width: max-content; }
#t {
  border-collapse: separate; border-spacing: 0; table-layout: fixed;
  font-size: 13px; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums;
}
#t th, #t td {
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  height: 26px; padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#t th {
  background: var(--head); color: var(--muted); font-weight: 500; text-align: center;
  position: sticky; z-index: 2; cursor: default; padding: 0;
}
#t thead th { top: 0; }
#t tbody th { left: 0; }
#t thead th:first-child { left: 0; z-index: 3; }
#t th.on { color: var(--accent); background: var(--sel); font-weight: 600; }
#t td[data-t="n"] { text-align: right; }
#t td[data-t="b"] { text-align: center; }
#t td[data-t="e"] { color: var(--err); }
#t td[data-b="1"] { font-weight: 700; }
#t td.sel { background: var(--sel); }
#t td.act { background: var(--panel); outline: 2px solid var(--accent); outline-offset: -2px; }
#ed {
  position: absolute; z-index: 5; margin: 0; border: 2px solid var(--accent); border-radius: 0;
  background: var(--panel); color: var(--ink); padding: 0 5px; font: 13px var(--ui); outline: none;
}
#ed[hidden] { display: none; }

#foot { display: flex; align-items: center; gap: 12px; padding: 6px 12px; color: var(--muted); font-size: 12px; min-height: 28px; }
#left { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#left.flash { color: var(--ink); }
#saved { flex: none; }
#bTheme { flex: none; padding: 2px 10px; font-size: 12px; color: var(--muted); }
@media (pointer: coarse) {
  #t th, #t td { height: 34px; }
  input, select { font-size: 16px; }
  #ed { font-size: 16px; }
}
@media (max-width: 520px) { button, select { padding: 5px 8px; } .row { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header id="top" class="row">
  <input id="name" value="Untitled sheet" aria-label="Sheet name" maxlength="80" autocomplete="off">
  <span class="sp"></span>
  <button id="bNew" title="Start a blank sheet (can be undone)">New</button>
  <button id="bOpen" title="Open a .csv or saved .json file">Open</button>
  <button id="bSave" title="Save a .json file that keeps formulas and formatting">Save</button>
  <button id="bCsv" title="Export computed values as .csv">CSV</button>
  <input id="file" type="file" accept=".csv,.tsv,.txt,.json,text/csv,application/json" hidden>
</header>
<div id="tools" class="row" style="padding-top:0">
  <button id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
  <button id="bBold" aria-pressed="false" title="Bold (Ctrl+B)">B</button>
  <select id="fmt" aria-label="Number format">
    <option value="auto">General</option>
    <option value="num2">1,234.56</option>
    <option value="int">1,235</option>
    <option value="usd">$1,234.56</option>
    <option value="pct">12.3%</option>
    <option value="date">11/4/2026</option>
    <option value="iso">2026-11-04</option>
  </select>
  <select id="act" aria-label="Rows, columns and sort">
    <option value="">Edit…</option>
    <optgroup label="Rows">
      <option value="rowAbove">Insert row above</option>
      <option value="rowBelow">Insert row below</option>
      <option value="rowDel">Delete row</option>
    </optgroup>
    <optgroup label="Columns">
      <option value="colLeft">Insert column left</option>
      <option value="colRight">Insert column right</option>
      <option value="colDel">Delete column</option>
      <option value="wider">Wider column</option>
      <option value="narrower">Narrower column</option>
    </optgroup>
    <optgroup label="Sort by this column">
      <option value="asc">Sort A to Z</option>
      <option value="desc">Sort Z to A</option>
    </optgroup>
  </select>
</div>
<div id="fxrow" class="row">
  <span id="addr" aria-live="polite">A1</span>
  <input id="fx" aria-label="Cell content" placeholder="Value or =formula" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>
<div id="wrap" tabindex="0" aria-label="Spreadsheet grid">
  <div id="sheet"><table id="t"></table><input id="ed" hidden aria-label="Edit cell" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
</div>
<footer id="foot"><span id="left"></span><span id="saved"></span><button id="bTheme" type="button" title="Switch between light and dark"></button></footer>

<script>

  $('bBold').setAttribute('aria-pressed', o && o.b ? 'true' : 'false');
  $('fmt').value = effFmt(keyOf(anchor.r, anchor.c)) || 'auto';
  {
    const R = selRect(), nr = R.r2 - R.r1 + 1, nc = R.c2 - R.c1 + 1, A = $('act');
    const L = (v, t) => { A.querySelector('[value="' + v + '"]').textContent = t; };
    L('rowAbove', nr > 1 ? 'Insert ' + nr + ' rows above' : 'Insert row above'); L('rowBelow', nr > 1 ? 'Insert ' + nr + ' rows below' : 'Insert row below');
    L('rowDel', nr > 1 ? 'Delete ' + nr + ' rows' : 'Delete row');
    L('colLeft', nc > 1 ? 'Insert ' + nc + ' columns left' : 'Insert column left'); L('colRight', nc > 1 ? 'Insert ' + nc + ' columns right' : 'Insert column right');
    L('colDel', nc > 1 ? 'Delete ' + nc + ' columns' : 'Delete column');
  }
  $('bUndo').disabled = !undoS.length; $('bRedo').disabled = !redoS.length;
  renderStatus();
}
document.querySelectorAll('#top button, #tools button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
$('bUndo').onclick = () => { undo(); wrap.focus(); };
$('bRedo').onclick = () => { redo(); wrap.focus(); };
$('bBold').onclick = () => { toggleBold(); wrap.focus(); };
$('fmt').onchange = e => { setFormat(e.target.value); wrap.focus(); };
$('name').addEventListener('input', e => { name = e.target.value; scheduleSave(); });
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') wrap.focus(); });
$('bNew').onclick = () => { checkpoint(); cells = {}; colW = new Array(COLS).fill(CW); applyWidths(); name = 'Untitled sheet'; $('name').value = name; afterChange(); moveTo(0, 0); say('Blank sheet. Undo brings your last one back.'); };

/* ---------- open / save / csv ---------- */
function loadData(d) {
  if (!d || typeof d !== 'object' || !d.cells || typeof d.cells !== 'object') throw new Error('This file is not a Minisheet save.');
  const out = {}; let maxR = 0;
  for (const k of Object.keys(d.cells)) {
    const p = parseKey(k), o = d.cells[k];
    if (!p || p.r >= MAXROWS || !o) continue;
    const v = o.v == null ? '' : String(o.v);
    const n = { v };
    if (o.b) n.b = 1;
    if (['num2', 'int', 'usd', 'pct', 'date', 'iso'].includes(o.f)) n.f = o.f;
    if (n.v === '' && !n.b && !n.f) continue;
    out[k] = n; if (p.r > maxR) maxR = p.r;
  }
  ensureRows(maxR + 50);
  const w = Array.isArray(d.w) && d.w.length === COLS ? d.w.map(x => clamp(+x || CW, 40, 600)) : new Array(COLS).fill(CW);
  return { cells: out, w };
}
function importText(text, fname) {
  let nextCells, nextW = new Array(COLS).fill(CW), nextName = fname.replace(/\.[^.]*$/, '') || 'Imported', note = '';
  if (/\.json$/i.test(fname) || /^\s*\{/.test(text)) {
    const d = JSON.parse(text), L = loadData(d); nextCells = L.cells; nextW = L.w; if (d.name) nextName = String(d.name).slice(0, 80);
  } else {
    const first = text.split(/\r?\n/, 1)[0];
    const count = ch => first.split(ch).length - 1;
    const delim = count('\t') >= Math.max(count(','), count(';')) && count('\t') > 0 ? '\t' : count(';') > count(',') ? ';' : ',';
    const rows = parseDelimited(text, delim);
    nextCells = {}; let cut = false;
    rows.forEach((row, r) => row.forEach((v, c) => {
      if (r >= MAXROWS || c >= COLS) { if (v !== '') cut = true; return; }
      if (v !== '') nextCells[keyOf(r, c)] = { v };
    }));
    ensureRows(Math.min(rows.length, MAXROWS) + 50);
    if (cut) note = ' Rows past ' + MAXROWS + ' or columns past Z were left out.';
  }
  checkpoint(); cells = nextCells; colW = nextW; applyWidths(); name = nextName; $('name').value = name;
  afterChange(); moveTo(0, 0);
  say('Opened ' + fname + '. Ctrl+Z undoes this.' + note);
}
$('bOpen').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { importText(await f.text(), f.name); } catch (err) { say('Could not open ' + f.name + ': ' + err.message); }
};
let dl = null;
if (window.claude && typeof claude.use === 'function') {
  claude.use('downloads').then(d => { dl = d; }).catch(() => {});
}
function exportFile(filename, text, label) {
  if (dl) {
    dl.save({ filename, data: text }).then(() => say(label + ' saved as ' + filename), err => {
      if (err && err.code === 'declined') return;
      say('Could not save the file' + (err && err.message ? ': ' + err.message : '.'));
    });
  } else if (!window.claude) {
    // Opened as an ordinary web page: a normal browser download.
    const csv = /\.csv$/i.test(filename);
    const blob = new Blob([(csv ? '\ufeff' : '') + text], { type: csv ? 'text/csv;charset=utf-8' : 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say(label + ' downloaded as ' + filename);
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => say('Downloads are not available here, so the ' + label + ' was copied to your clipboard.'),
      () => say('Downloads and clipboard are not available here.'));
  } else say('Downloads are not available here.');
}
const fileBase = () => (name.trim() || 'sheet').replace(/[\\/:*?"<>|]+/g, '-');
$('bSave').onclick = () => { finishEdit(true); exportFile(fileBase() + '.json', JSON.stringify({ v: 1, name, cells, w: colW }), 'file'); };
const csvNum = (v, k) => { const f = effFmt(k); return (f === 'date' || f === 'iso') && validSerial(v) ? fmtNum(v, 'iso') : gen(v); };
$('bCsv').onclick = () => {
  finishEdit(true);
  let mr = -1, mc = -1;
  for (const k of Object.keys(cells)) { if (cells[k].v === '') continue; const p = parseKey(k); if (p.r > mr) mr = p.r; if (p.c > mc) mc = p.c; }
  if (mr < 0) { say('Nothing to export yet.'); return; }
  const lines = [];
  for (let r = 0; r <= mr; r++) {
    const row = [];
    for (let c = 0; c <= mc; c++) {
      let v = ctx.cache.get(keyOf(r, c)); if (v === undefined) v = null;
      let s = v === null ? '' : v instanceof SErr ? v.code : typeof v === 'number' ? csvNum(v, keyOf(r, c)) : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : v;
      if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s;
      row.push(/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
    }
    lines.push(row.join(','));
  }
  exportFile(fileBase() + '.csv', lines.join('\r\n') + '\r\n', 'CSV');
};

/* ---------- light / dark ---------- */
const dark = matchMedia('(prefers-color-scheme: dark)');
function effTheme() { const r = document.documentElement; return r.dataset.mode || r.dataset.theme || (dark.matches ? 'dark' : 'light'); }
function paintTheme() { $('bTheme').textContent = effTheme() === 'dark' ? 'Light mode' : 'Dark mode'; }
$('bTheme').onclick = () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.mode = next;
  try { localStorage.setItem('minisheet.theme', next); } catch (e) {}
  paintTheme();
};
dark.addEventListener('change', paintTheme);
paintTheme();

/* ---------- start ---------- */
function sample() {
  const rows = [
    ['Item', 'Qty', 'Price', 'Total'],
    ['Pens', '12', '1.5', '=B2*C2'],
    ['Notebooks', '4', '3.25', '=B3*C3'],
    ['Stapler', '1', '12.9', '=B4*C4'],
    ['Tape', '6', '2.1', '=B5*C5'],
    ['Total', '=SUM(B2:B5)', '', '=SUM(D2:D5)'],
    ['', '', '', ''],
    ['Tax rate', '', '', '8%'],
    ['Tax', '', '', '=D6*D8'],
    ['Grand total', '', '', '=D6+D9']
  ];
  const c = {};
  rows.forEach((row, r) => row.forEach((v, i) => { if (v !== '') c[keyOf(r, i)] = { v }; }));
  for (const k of ['A1', 'B1', 'C1', 'D1', 'A6', 'B6', 'D6', 'A10', 'D10']) c[k].b = 1;
  for (const k of ['C2', 'C3', 'C4', 'C5']) c[k].f = 'usd';
  for (const k of ['D2', 'D3', 'D4', 'D5', 'D6', 'D9', 'D10']) c[k].f = 'usd';
  c.D8.f = 'pct';
  return c;
}
buildTable();
thead_hover();
let restored = false;
try {
  const s = localStorage.getItem(LS);
  if (s) { const d = JSON.parse(s), L = loadData(d); cells = L.cells; colW = L.w; if (d.name) name = String(d.name).slice(0, 80); restored = true; }
} catch (e) { cells = {}; }
if (!restored) cells = sample();
applyWidths();
$('name').value = name;
recalc(); renderAll(); paint();
setSaved(restored ? 'Saved in this browser' : '');
wrap.focus({ preventScroll: true });
